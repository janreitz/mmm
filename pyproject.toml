[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marta"
version = "0.1.0"
description = "Marta Musik Maschine - an RFID-controlled music box for kids"
requires-python = ">=3.11"
dependencies = [
    "gpiozero",
    "pyserial",
    "psutil",
    # provides the _rpi_ws281x SWIG module used by the vendored neopixel.py shim;
    # only installable/useful on the Pi itself
    'rpi-ws281x; platform_machine == "armv6l" or platform_machine == "armv7l" or platform_machine == "aarch64"',
    # gpiozero's pin factory. Without it, gpiozero falls back all the way to
    # its legacy sysfs-based NativeFactory, which fails outright on current
    # Raspberry Pi OS kernels (no working /sys/class/gpio export). lgpio is
    # gpiozero's first-choice backend and what the box's original venv had.
    'lgpio; platform_machine == "armv6l" or platform_machine == "armv7l" or platform_machine == "aarch64"',
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools]
packages = ["marta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# neopixel.py is vendored third-party code, replaced in stage 4
extend-exclude = ["marta/neopixel.py", "env"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# E722 (bare except): deliberate legacy pattern in Marta.terminate, revisit in stage 3
# E731 (lambda assignment): legacy callback style, dies with stage 2 adapters
ignore = ["E722", "E731"]

[tool.ruff.lint.per-file-ignores]
# star import from the vendored neopixel shim
"marta/ledstrip.py" = ["F403", "F405"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^env/", "^marta/neopixel\\.py$"]

[[tool.mypy.overrides]]
# star-imports everything from the vendored neopixel.py shim (replaced in
# stage 4); mypy can't see names through `from neopixel import *` from an
# excluded module, so this file is checked only by ruff until then.
module = "marta.ledstrip"
ignore_errors = true
