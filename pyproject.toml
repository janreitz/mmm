[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marta"
version = "0.1.0"
description = "Marta Musik Maschine - an RFID-controlled music box for kids"
requires-python = ">=3.11"
dependencies = [
    "gpiozero",
    "pyserial",
    "psutil",
    # provides the _rpi_ws281x SWIG module used by the vendored neopixel.py shim;
    # only installable/useful on the Pi itself
    'rpi-ws281x; platform_machine == "armv6l" or platform_machine == "armv7l" or platform_machine == "aarch64"',
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools]
packages = ["marta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# neopixel.py is vendored third-party code, replaced in stage 4
extend-exclude = ["marta/neopixel.py", "env"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# E722 (bare except): deliberate legacy pattern in Marta.terminate, revisit in stage 3
# E731 (lambda assignment): legacy callback style, dies with stage 2 adapters
ignore = ["E722", "E731"]

[tool.ruff.lint.per-file-ignores]
# star import from the vendored neopixel shim
"marta/LEDStrip.py" = ["F403", "F405"]
# sys.path shims before imports, removed with the stage-2 import rewrite
"marta/__main__.py" = ["E402"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
# Permissive baseline: the legacy flat imports ("import Buttons") resolve to Any,
# so modules are checked in isolation. The stage-2 package-relative import
# rewrite makes cross-module checking light up without further config.
ignore_missing_imports = true
# var-annotated: module-level dict globals (Buttons._buttons, TagToDir.TAG_TO_DIR)
# that stage 2 replaces with injected state entirely; annotating them now is
# effort spent on code about to be deleted.
disable_error_code = ["var-annotated"]
exclude = ["^env/", "^marta/neopixel\\.py$"]

[[tool.mypy.overrides]]
# star-imports everything from the vendored neopixel.py shim (replaced in
# stage 4); mypy can't see names through `from neopixel import *` from an
# excluded module, so this file is checked only by ruff until then.
module = "marta.LEDStrip"
ignore_errors = true
